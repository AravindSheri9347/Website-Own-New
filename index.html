<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <h1>Login</h1>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <p class="forgot-text" onclick="goToForgot()">Forgot Password?</p>

    <button class="login-btn" onclick="checkLogin()">Log in</button>

    <p id="message"></p>
    <a href="register.html" class="register-text">Register</a>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
<script>
window.onload = function () {
    var user = localStorage.getItem("tempUser");
    if (user) {
        document.getElementById("username").value = user;
    }
};
</script>
