<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="chat-body">

<div class="chat-container">

    <div class="chat-header">
        Welcome Chaithra👋
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">Hello! Chaithra How are you?</div>
        <!-- <div class="message bot"> Busy anukunta kada snap lo msg led m led</div> -->
    </div>

    <div class="chat-input">
        <div class="chat-input">

        <!-- + ICON -->
        <label for="fileInput" class="plus-icon">+</label>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="sendImage()">
    
        <!-- TEXT INPUT -->
        <input type="text" id="chatInput" placeholder="Type message...">
    
        <!-- SEND BUTTON -->
        <button onclick="sendMessage()">Send</button>
    </div>
    </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
