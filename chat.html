<!DOCTYPE html>
<html>
<head>
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-box">

  <!-- TOP BAR -->
  <div class="chat-top">
    <div class="chat-user" id="chatUser">User Name</div>
    <div class="chat-status" id="chatStatus">online</div>
  </div>

  <!-- MESSAGES -->
  <div id="messages"></div>

  <!-- INPUT -->
  <div class="chat-input">
    <input type="text" id="msg" placeholder="Type a message..." />
    <div class="send-icon" onclick="sendMessage()">➤</div>
  </div>

</div>
<script type="module" src="chat.js"></script>

</body>
</html>
