<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <h1>Register</h1>

    <!-- EMAIL -->
    <input type="email" id="regEmail" placeholder="Enter Email">

    <!-- PASSWORD -->
    <input type="password" id="regPass" placeholder="Enter Password">

    <!-- BUTTON -->
    <button class="register-btn" onclick="registerUser()">REGISTER</button>

    <!-- MESSAGE -->
    <p id="regMessage"></p>
</div>

<script src="script.js"></script>

<script>
/* ✅ Auto-fill email from login page */
window.onload = function () {
    var savedEmail = localStorage.getItem("tempEmail");
    if (savedEmail) {
        document.getElementById("regEmail").value = savedEmail;
    }
};
</script>

</body>
</html>
